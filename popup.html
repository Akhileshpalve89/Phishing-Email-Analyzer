<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Threat Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="icon16.png">
    <style>
    
    :root {
      --primary: #4361ee;
      --primary-dark: #3a0ca3;
      --success: #4cc9f0;
      --warning: #f8961e;
      --danger: #f72585;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #6c757d;
      --white: #ffffff;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      width: 320px;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      color: var(--dark);
      padding: 20px;
    }
    .container {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: all 0.3s ease;
    }
    .container:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(31, 38, 135, 0.2);
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .shield-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      margin-right: 10px;
    }
    .subtitle {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 400;
    }
    .analysis-section {
      padding: 24px;
    }
    .result-summary {
      text-align: center;
      margin-bottom: 24px;
    }
    #threat-level {
      font-size: 16px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 50px;
      margin-bottom: 8px;
      display: inline-block;
    }
    .safe {
      background: linear-gradient(135deg, var(--success) 0%, #38b000 100%);
      color: white;
    }
    .warning {
      background: linear-gradient(135deg, var(--warning) 0%, #f3722c 100%);
      color: white;
    }
    .danger {
      background: linear-gradient(135deg, var(--danger) 0%, #b5179e 100%);
      color: white;
    }
    .score {
      font-size: 13px;
      color: var(--gray);
      font-weight: 500;
    }
    .details {
      margin: 24px 0;
    }
    .details h3 {
      font-size: 14px;
      margin-bottom: 16px;
      color: var(--dark);
      font-weight: 600;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(0,0,0,0.08);
    }
    .detail-label {
      font-weight: 500;
      color: var(--gray);
    }
    .detail-value {
      font-weight: 600;
    }
    .safe-value {
      color: #38b000;
    }
    .warning-value {
      color: var(--warning);
    }
    .danger-value {
      color: var(--danger);
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button i {
      margin-right: 6px;
      font-size: 14px;
    }
    .analyze-button {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
    }
    .analyze-button:hover {
      background: var(--primary-dark);
    }
    .info-button {
      background: transparent;
      color: var(--primary);
      border: 1px solid rgba(67, 97, 238, 0.3);
    }
    .info-button:hover {
      background: rgba(67, 97, 238, 0.05);
    }
    footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--gray);
      text-align: center;
      opacity: 0.7;
    }
    </style>
</head>
<body>
    <div class="container">
      <header>
        <h1><span class="shield-icon"><i class="fas fa-shield-alt"></i></span> EmailGuard Pro</h1>
        <p class="subtitle">Advanced Threat Protection</p>
      </header>
  
      <div class="analysis-section">
        <div class="result-summary">
          <div id="threat-level" class="safe"><i class="fas fa-check-circle"></i> Secure</div>
          <div class="score">Confidence: <span id="confidence">100%</span></div>
        </div>
  
        <div class="details">
          <h3>Security Analysis</h3>
          <div class="detail-item">
            <span class="detail-label">Sender Reputation:</span>
            <span id="sender" class="detail-value safe-value">Trusted</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Link Safety:</span>
            <span id="links" class="detail-value safe-value">Verified</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Attachments:</span>
            <span id="attachments" class="detail-value safe-value">None</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Content Scan:</span>
            <span id="content" class="detail-value safe-value">Clean</span>
          </div>
        </div>
  
        <div class="button-group">
          <button id="analyze-btn" class="analyze-button"><i class="fas fa-sync-alt"></i> Rescan</button>
          <button id="more-info" class="info-button"><i class="fas fa-info-circle"></i> Details</button>
        </div>
        
        <div id="report-details" style="margin-top: 10px; font-size: 12px; color: #444;"></div>
        
        <footer>
          <p class="timestamp">Last analyzed: <span id="time">just now</span> <i class="fas fa-clock"></i></p>
        </footer>
      </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
